
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PI - Cadastro de Produto</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="topbar">

        <div class="logo">

            <span>PI</span>

            <div>
                <h1>Gestão de Produtos</h1>
                <small>Sistema Web</small>
            </div>

        </div>

        <nav>

            <a href="index.html">Início</a>

            <a href="produtos.html">Produtos</a>

            <a href="cadastro-produto.html" class="active">
                Cadastrar
            </a>

        </nav>

    </header>


    <main class="container">

        <section class="page-header">

            <div>

                <h2>Novo produto</h2>

                <p>
                    Preencha os dados abaixo para cadastrar um produto.
                </p>

            </div>

        </section>


        <section class="panel form-panel">

            <form id="formProduto">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="idProduto">
                            ID do produto
                        </label>

                        <input
                            type="number"
                            id="idProduto"
                            placeholder="Ex.: 1"
                            min="1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="nomeProduto">
                            Nome do produto
                        </label>

                        <input
                            type="text"
                            id="nomeProduto"
                            placeholder="Digite o nome do produto"
                            maxlength="100"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="precoProduto">
                            Preço
                        </label>

                        <input
                            type="number"
                            id="precoProduto"
                            placeholder="0,00"
                            min="0.01"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="quantidadeProduto">
                            Quantidade
                        </label>

                        <input
                            type="number"
                            id="quantidadeProduto"
                            placeholder="Ex.: 10"
                            min="0"
                            required
                        >

                    </div>

                </div>


                <div id="mensagem" class="mensagem"></div>


                <div class="form-actions">

                    <a href="produtos.html" class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Cadastrar produto
                    </button>

                </div>

            </form>

        </section>

    </main>


    <footer>

        <p>
            PI - Sistema Web de Gestão de Produtos
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
